# Sponsors displayed by the `sponsors` shortcode on the homepage.
# `logo` is a file inside `assets/media/sponsors/`; if the file is missing,
# the sponsor name is rendered as a text badge instead. Use `logos` instead of
# `logo` to put several images side by side in one badge under one link.
sponsors:
  - name: Southeast University
    short: SEU
    logo: seu.svg
    url: https://www.seu.edu.cn/
  - name: National Natural Science Foundation of China
    short: NSFC
    logo: nsfc.png
    url: https://www.nsfc.gov.cn/
  - name: Huawei & HiSilicon
    short: Huawei
    # Several logos share one badge; `alt` labels each image.
    logos:
      - file: huawei.svg
        alt: Huawei
      - file: hisilicon.png
        alt: HiSilicon
    url: https://www.huawei.com/
  - name: ByteDance
    short: ByteDance
    logo: bytedance.svg
    url: https://www.bytedance.com/
  - name: The Hong Kong University of Science and Technology
    short: HKUST
    logo: hkust.png
    url: https://hkust.edu.hk/
